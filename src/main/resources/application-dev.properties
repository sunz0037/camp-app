# 联调：端口 8080，无 context-path，接口前缀 /api/v1
server.port=8080

# H2 文件库。也可改成 jdbc:h2:mem:camp;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.url=jdbc:h2:file:./data/camp;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# 仓根脚本：Flyway 跑 db/migration，随后 Phase1SeedCallback 执行 db/seed/phase1_demo.sql
spring.flyway.enabled=true
spring.flyway.locations=filesystem:db/migration

camp.dev-auth.enabled=true
camp.phase2.enabled=false
camp.sms.enabled=false
