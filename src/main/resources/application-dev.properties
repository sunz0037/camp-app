# 本地一键：./gradlew bootRun --args='--spring.profiles.active=dev'
# 本 profile 会带上 h2（见 spring.profiles.group.dev），因此连 H2，不连远程 MySQL。
# 端口 8080，无 context-path，接口 /api/v1。
# 脚本：db/h2/schema.sql + db/h2/seed.sql（H2 适配；MySQL 仍用 db/migration 与 db/seed）。

server.port=8080

camp.dev-auth.enabled=true
camp.phase2.enabled=false
camp.sms.enabled=false
