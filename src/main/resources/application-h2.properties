# 本地 H2。在仓库根目录启动：
#   ./gradlew bootRun --args='--spring.profiles.active=h2'
#
# 不用远程 MySQL，也不用 Hibernate ddl-auto=update 改表。
# 表结构来自 db/h2/schema.sql，演示数据来自 db/h2/seed.sql。
# file: 路径相对进程工作目录，必须是仓库根目录。

spring.datasource.url=jdbc:h2:mem:camp;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.pool-name=CampH2Pool

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none

spring.sql.init.mode=always
spring.sql.init.schema-locations=file:db/h2/schema.sql
spring.sql.init.data-locations=file:db/h2/seed.sql
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
