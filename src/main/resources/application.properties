# 首期默认关闭考试/成绩/访客与短信找回。需要时再打开。
camp.phase2.enabled=false
camp.sms.enabled=false
# 开发态身份仅在 profile=dev 或显式打开时生效，见 application-dev.properties
camp.dev-auth.enabled=false
camp.jwt.secret=camp-phase1-dev-secret-please-change-32b
camp.jwt.access-ttl-seconds=7200
camp.jwt.refresh-ttl-seconds=604800
camp.upload.dir=data/uploads

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

