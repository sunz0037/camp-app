# 本地 H2（不连远程 MySQL）：
#   ./gradlew bootRun --args='--spring.profiles.active=h2'
# 配置见 application-h2.properties，脚本是 db/h2/schema.sql 与 db/h2/seed.sql。

# Spring Boot Application Configuration
# 默认仍是下方 MySQL。本地不想连远程库时：--spring.profiles.active=h2
# 见 application-h2.properties 与 db/README.md
spring.application.name=camp-app
server.port=8080


spring.datasource.url=jdbc:mysql://150.158.115.149:3306/camp?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&autoReconnect=true&failOverReadOnly=false&maxReconnects=3&initialTimeout=2&connectTimeout=30000&socketTimeout=60000&tcpKeepAlive=true&tcpNoDelay=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=campuser
spring.datasource.password=camp123456


spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.pool-name=CampHikariPool

# H2 Database Configuration (commented out)
# spring.datasource.url=jdbc:h2:mem:campus_oa;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS PUBLIC
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# JPA：表结构以仓库根 db/migration 为准，禁止 Hibernate 改表
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# 建表以 SQL 为准：MySQL 用 db/migration，本地 H2 用 db/h2。禁止 ddl-auto=update

# 首期默认关闭访客与短信找回。考试成绩见 camp.phase2.exam.enabled。
camp.phase2.enabled=false
camp.phase2.exam.enabled=true
camp.phase2.visitor.enabled=false
camp.sms.enabled=false
# 开发态身份在 profile=h2 或 camp.dev-auth.enabled=true 时生效
camp.dev-auth.enabled=false
camp.jwt.secret=camp-phase1-dev-secret-please-change-32b
camp.jwt.access-ttl-seconds=7200
camp.jwt.refresh-ttl-seconds=604800
# 改密复杂度。失败码 422，文案即规则。history-size=0 只拒绝与当前密码相同。
camp.auth.password.min-length=8
camp.auth.password.require-upper=true
camp.auth.password.require-lower=true
camp.auth.password.require-digit=true
camp.auth.password.require-special=true
camp.auth.password.reject-username=true
camp.auth.password.history-size=0
# 连续密码错误锁定。max-failures<=0 关闭。锁定码 423。计数在进程内，LOGIN_FAIL 仍写审计。
camp.auth.lock.max-failures=5
camp.auth.lock.lock-seconds=900
camp.upload.dir=data/uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

