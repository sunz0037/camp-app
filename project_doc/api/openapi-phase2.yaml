openapi: 3.0.3
info:
  title: 校园OA二期增量
  version: 2.0.0
  description: |
    在首期 /api/v1 上补充写路径、文件、考试、来访和主题。
    考试落在 edu_exams，文件落在 oa_files。改密别名走 Wave A。
    短信、待办、GPA 未实现。网盘列表和目录见 phase2-files.md。分享只读已有行，不能创建。
servers:
  - url: http://localhost:8080/api/v1
paths:
  /files:
    get:
      summary: 网盘列表
      parameters:
        - { name: parentId, in: query, schema: { type: integer } }
        - { name: purpose, in: query, schema: { type: string } }
        - { name: scope, in: query, schema: { type: string, enum: [mine, shared, all] } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
      responses:
        "200":
          description: data.items 为文件或目录
  /files/folders:
    post:
      summary: 新建目录
      responses:
        "200":
          description: data.directory 为 true
  /files/upload:
    post:
      summary: 上传
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                purpose: { type: string, enum: [AVATAR, ANNOUNCEMENT, OTHER, STUDENT_IMPORT, STUDENT_EXPORT] }
                parentId: { type: integer }
      responses:
        "200":
          description: data.fileId 与 data.url
  /files/{fileId}:
    parameters: [{ name: fileId, in: path, required: true, schema: { type: integer } }]
    get: { summary: 读取文件, responses: { "200": { description: bytes } } }
    delete: { summary: 删除, responses: { "200": { description: OK } } }
  /exam-schedules:
    get: { summary: 考试安排列表, responses: { "200": { description: OK } } }
    post:
      summary: 创建考试安排 course:write
      responses: { "200": { description: 返回安排 } }
  /exam-schedules/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    put: { summary: 更新, responses: { "200": { description: OK } } }
    delete: { summary: 删除, responses: { "200": { description: OK } } }
  /exam-schedules/{id}/cancel:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    put: { summary: 取消, responses: { "200": { description: OK } } }
  /scores:
    get: { summary: 成绩列表。学生仅本人, responses: { "200": { description: OK } } }
    post: { summary: 录入 course:write, responses: { "200": { description: 返回成绩，含 gradePoint } } }
  /scores/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    put: { summary: 修改成绩, responses: { "200": { description: OK } } }
    delete: { summary: 删除成绩, responses: { "200": { description: OK } } }
  /visitors:
    get: { summary: 来访列表, responses: { "200": { description: OK } } }
    post: { summary: 登记来访，固定 PENDING, responses: { "200": { description: 返回来访 } } }
  /visitors/{id}/approve:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    post: { summary: 管理员或教务审批, responses: { "200": { description: APPROVED } } }
  /me/settings:
    get: { summary: 当前用户主题, responses: { "200": { description: themeKey } } }
    put: { summary: 更新主题, responses: { "200": { description: themeKey } } }
  /auth/change-password:
    post:
      summary: 修改密码。行为与 PUT /auth/password 相同，走 Wave A
      responses: { "200": { description: 新的登录响应 } }
components:
  securitySchemes:
    devBearer:
      type: http
      scheme: bearer
